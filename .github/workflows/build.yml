name: Build, Test and Publish

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK (preinstalado no runner)
        run: echo "ANDROID_HOME=$ANDROID_HOME" && test -n "$ANDROID_HOME"
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew :app:test --console=plain
      - name: Assemble release (assinado)
        run: ./gradlew :app:assembleRelease --console=plain
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pulsa-release-apk
          path: app/build/outputs/apk/release/app-release.apk

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: Pulsa-release-apk
          path: apk
      - name: Extrai versao do build.gradle.kts
        run: |
          CODE=$(sed -n 's/.*versionCode[[:space:]]*= *\([0-9]*\).*/\1/p' app/build.gradle.kts)
          NAME=$(sed -n 's/.*versionName[[:space:]]*= *"\([^"]*\)".*/\1/p' app/build.gradle.kts)
          echo "CODE=$CODE" >> "$GITHUB_ENV"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
      - name: Checkout pulsaweb
        uses: actions/checkout@v4
        with:
          repository: cleberleonheart-maker/pulsaweb
          token: ${{ secrets.PULSAWEB_TOKEN }}
          path: pulsaweb
      - name: Publica APK e arquivo de versao
        run: |
          cp apk/app-release.apk pulsaweb/Pulsa.apk
          printf '%s|%s|https://cleberleonheart-maker.github.io/pulsaweb/Pulsa.apk' "$CODE" "$NAME" > pulsaweb/version
          git -C pulsaweb config user.name "Pulsa CI"
          git -C pulsaweb config user.email "pulsa-ci@users.noreply.github.com"
          git -C pulsaweb add Pulsa.apk version
          git -C pulsaweb commit -m "v$NAME (code $CODE): publicacao automatica via CI"
          git -C pulsaweb push origin main