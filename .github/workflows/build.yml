name: Build, Test and Publish

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Cache Gradle (wrapper + dependencias)
        uses: gradle/actions/setup-gradle@v6
      - name: Android SDK (preinstalado no runner)
        run: echo "ANDROID_HOME=$ANDROID_HOME" && test -n "$ANDROID_HOME"
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Prepara o keystore de release (CI)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Sem fallback de propósito: o fallback antigo ("android"/"androiddebugkey") é a
          # chave de debug do Android, que é pública — com ela, qualquer pessoa assina um
          # APK com o pacote do Pulsa e o app aceita como atualização. Sem os secrets, as
          # variáveis ficam vazias e o build do release falha (é o comportamento correto:
          # melhor não publicar do que publicar um APK falsificável).
          # O `secrets` não pode ser lido no `if` do passo (o contexto não existe ali), então
          # a checagem é feita dentro do shell, com o valor no `env` do passo.
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::notice::Secrets de assinatura ausentes: este job roda sem release assinado."
            exit 0
          fi
          mkdir -p app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/pulsa.keystore
          echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${KEY_ALIAS}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${KEY_PASSWORD}" >> "$GITHUB_ENV"
      - name: Unit tests
        run: ./gradlew :app:test --console=plain
      - name: Checagem das migrações do Room
        run: |
          ./gradlew :app:kspDebugKotlin --console=plain
          python3 tools/check_room_migration.py
      - name: Lint do Android (nao bloqueia)
        continue-on-error: true
        run: ./gradlew :app:lint --console=plain
      - name: Monta o APK
        run: |
          mkdir -p apk-out
          if [ -f app/keystore/pulsa.keystore ]; then
            ./gradlew :app:assembleRelease --console=plain
            cp app/build/outputs/apk/release/app-release.apk apk-out/app-release.apk
          else
            # Sem keystore (PR de fork, secrets indisponíveis): o APK de debug só serve
            # para o teste do CI. O job de publicação recusa esse arquivo.
            ./gradlew :app:assembleDebug --console=plain
            cp app/build/outputs/apk/debug/app-debug.apk apk-out/app-debug.apk
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Pulsa-release-apk
          path: apk-out/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: Pulsa-release-apk
          path: apk
      - name: Extrai versao do build.gradle.kts
        run: |
          CODE=$(sed -n 's/.*versionCode[[:space:]]*= *\([0-9]*\).*/\1/p' app/build.gradle.kts)
          NAME=$(sed -n 's/.*versionName[[:space:]]*= *"\([^"]*\)".*/\1/p' app/build.gradle.kts)
          echo "CODE=$CODE" >> "$GITHUB_ENV"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
      - name: Checkout pulsaweb
        uses: actions/checkout@v5
        with:
          repository: cleberleonheart-maker/pulsaweb
          token: ${{ secrets.PULSAWEB_TOKEN }}
          path: pulsaweb
      - name: Publica APK e arquivo de versao
        run: |
          if [ ! -f apk/app-release.apk ]; then
            echo "::error::APK release assinado ausente: nada sera publicado."
            exit 1
          fi
          cp apk/app-release.apk pulsaweb/Pulsa.apk
          printf '%s|%s|https://cleberleonheart-maker.github.io/pulsaweb/Pulsa.apk' "$CODE" "$NAME" > pulsaweb/version
          git -C pulsaweb config user.name "Pulsa CI"
          git -C pulsaweb config user.email "pulsa-ci@users.noreply.github.com"
          git -C pulsaweb add Pulsa.apk version
          git -C pulsaweb commit --allow-empty -m "v$NAME (code $CODE): publicacao automatica via CI"
          git -C pulsaweb fetch origin main
          REMOTE_CODE=$(git -C pulsaweb show origin/main:version 2>/dev/null | cut -d'|' -f1)
          if [ -n "$REMOTE_CODE" ] && [ "$REMOTE_CODE" -ge "$CODE" ]; then
            echo "Pulsaweb ja tem v$REMOTE_CODE (>= $CODE); nada a publicar"
          else
            git -C pulsaweb pull --rebase origin main
            git -C pulsaweb push origin main
          fi
      - name: Cria Release no GitHub (com o APK anexado)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG ja existe; reenviando o APK"
            gh release upload "$TAG" apk/app-release.apk --clobber
          else
            gh release create "$TAG" apk/app-release.apk \
              --title "Pulsa $NAME ($CODE)" \
              --notes "Publicacao automatica da versao $NAME (code $CODE)."
          fi
          # Mantem a pagina /releases/latest apontando pra versao mais nova
          gh release edit "$TAG" --latest 2>/dev/null || true